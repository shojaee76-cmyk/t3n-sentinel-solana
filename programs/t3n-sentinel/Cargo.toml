[package]
name = "t3n-sentinel"
version = "0.1.0"
description = "Private API-key vault & health sentinel for Solana AI agents"
edition = "2021"
license = "MIT"
repository = "https://github.com/shojaee76-cmyk/t3n-sentinel-solana"

[lib]
crate-type = ["cdylib", "lib"]
name = "t3n_sentinel"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# integration tests are run via anchor test; dev-deps are pulled in then
# solana-program-test = "=2.2.1"
# solana-sdk = "=2.2.1"
